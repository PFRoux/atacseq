---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "chromvar"
description: Compute chromVAR motif accessibility deviations from consensus ATAC-seq peak counts
keywords:
  - atac-seq
  - motifs
  - chromvar
  - accessibility
tools:
  - chromvar:
      description: "Bias-corrected deviations in chromatin accessibility across motifs or annotations"
      homepage: "https://greenleaflab.github.io/chromVAR/"
      documentation: "https://greenleaflab.github.io/chromVAR/"
      doi: "10.1038/nmeth.4401"
      licence: ["MIT"]
      identifier: "biotools:chromvar"

input:
  - meta:
      type: map
      description: |
        Groovy Map containing count matrix information
        e.g. `[ id:'consensus_peaks' ]`
  - counts:
      type: file
      description: Raw count matrix generated over consensus peaks
      pattern: "*.raw_counts.tsv"
  - matches:
      type: file
      description: Sparse motif-by-peak match matrix produced by motifmatchr
      pattern: "*.motif_matches.mtx"
  - motif_peaks:
      type: file
      description: Mapping between motif-match matrix rows and consensus peaks
      pattern: "*.motifmatchr_peaks.tsv"
  - motif_ids:
      type: file
      description: Mapping between motif-match matrix columns and motif identifiers
      pattern: "*.motifmatchr_motifs.tsv"
  - fasta:
      type: file
      description: Reference genome FASTA
      pattern: "*.{fa,fasta}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing count matrix information
        e.g. `[ id:'consensus_peaks' ]`
  - deviations:
      type: file
      description: Long-format chromVAR deviation matrix
      pattern: "*.chromvar_deviations.tsv"
  - z:
      type: file
      description: Long-format chromVAR z-score matrix
      pattern: "*.chromvar_z.tsv"
  - variability:
      type: file
      description: Motif variability statistics
      pattern: "*.chromvar_variability.tsv"
  - pca:
      type: file
      description: PCA coordinates computed from chromVAR z-scores
      pattern: "*.chromvar_pca.tsv"
  - rds:
      type: file
      description: RDS object containing chromVAR inputs and results
      pattern: "*.chromvar.rds"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@PFRoux"
maintainers:
  - "@PFRoux"
