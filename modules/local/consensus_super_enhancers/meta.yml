---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "consensus_super_enhancers"
description: Merge ROSE per-sample super-enhancer tables into a consensus BED interval set
keywords:
  - atac-seq
  - consensus
  - rose
  - super-enhancer
tools:
  - python:
      description: "Python programming language"
      homepage: "https://www.python.org/"
      licence: ["PSF-2.0"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing run-level information
        e.g. `[ id:'consensus_super_enhancers' ]`
  - tables:
      type: file
      description: ROSE SuperStitched tables
      pattern: "*_SuperStitched.table.txt"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing run-level information
        e.g. `[ id:'consensus_super_enhancers' ]`
  - bed:
      type: file
      description: Merged consensus super-enhancer intervals
      pattern: "consensus_super_enhancers.bed"
  - saf:
      type: file
      description: Consensus super-enhancers in SAF format
      pattern: "consensus_super_enhancers.saf"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@PFRoux"
maintainers:
  - "@PFRoux"
