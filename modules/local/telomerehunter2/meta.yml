---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "telomerehunter2"
description: Estimate telomere content and telomeric variant repeats from aligned sequencing data
keywords:
  - telomere
  - repeats
  - bam
  - cram
  - atac-seq
tools:
  - telomerehunter2:
      description: "Python 3 implementation of TelomereHunter for telomere content and telomeric variant repeat analysis"
      homepage: "https://www.dkfz.de/angewandte-bioinformatik/telomerehunter"
      documentation: "https://ferdinand-popp.github.io/telomerehunter2/"
      tool_dev_url: "https://github.com/ferdinand-popp/telomerehunter2"
      doi: "10.1093/bioadv/vbag187"
      licence: ["GPL-3.0-or-later"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false ]`
  - bam:
      type: file
      description: Coordinate-sorted BAM file
      pattern: "*.bam"
  - bai:
      type: file
      description: BAM index file
      pattern: "*.{bai,csi}"
  - cytoband:
      type: file
      description: Optional cytoband file or empty list
      pattern: "*"
  - fast_mode:
      type: boolean
      description: Run TelomereHunter2 fast mode
  - plot_none:
      type: boolean
      description: Disable plot generation
  - repeats:
      type: string
      description: Optional comma-separated telomeric repeats
  - repeats_context:
      type: string
      description: Optional comma-separated telomeric repeat contexts

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false ]`
  - summary:
      type: file
      description: TelomereHunter2 summary table, copied from the output directory when present
      pattern: "*.telomerehunter2.summary.tsv"
  - tvr_top_contexts:
      type: file
      description: Telomeric variant repeat top contexts table, copied from the output directory when present
      pattern: "*.telomerehunter2.TVR_top_contexts.tsv"
  - singletons:
      type: file
      description: Telomeric variant repeat singleton table, copied from the output directory when present
      pattern: "*.telomerehunter2.singletons.tsv"
  - file_index:
      type: file
      description: Index of files generated in the TelomereHunter2 output directory
      pattern: "*.telomerehunter2.files.txt"
  - outdir:
      type: directory
      description: Complete TelomereHunter2 output directory
      pattern: "*.telomerehunter2"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@PFRoux"
maintainers:
  - "@PFRoux"
